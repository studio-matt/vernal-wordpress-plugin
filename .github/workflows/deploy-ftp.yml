name: Deploy to Server (FTP)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SERVER }}" ]; then
            echo "ERROR: SERVER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.USERNAME }}" ]; then
            echo "ERROR: USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "ERROR: PASSWORD secret is not set"
            exit 1
          fi
          echo "✓ All secrets are configured"
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/.gitignore
            **/README.md
            **/DEPLOYMENT.md
            **/VERSIONING.md
            **/.DS_Store
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose


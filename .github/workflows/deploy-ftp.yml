name: Deploy to Server (FTP - Disabled)

on:
  # Disabled - using SSH deployment instead (FTP passive mode issues)
  # Uncomment below to re-enable FTP deployment
  # push:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SERVER }}" ]; then
            echo "::error::SERVER secret is not set. Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.USERNAME }}" ]; then
            echo "::error::USERNAME secret is not set. Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "::error::PASSWORD secret is not set. Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✓ All secrets are configured"
          echo "Server: ${{ secrets.SERVER }}"
          echo "Username: ${{ secrets.USERNAME }}"
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          server-dir: /
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.gitignore
            **/README.md
            **/DEPLOYMENT.md
            **/VERSIONING.md
            **/TROUBLESHOOTING.md
            **/.DS_Store
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose


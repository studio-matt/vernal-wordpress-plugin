name: WP lost password (one-shot)

on:
  workflow_dispatch:
    inputs:
      user_login:
        description: WordPress username or email
        required: true
        default: irreverent

jobs:
  request-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Request lost password from clean IP
        run: |
          set -e
          USER_LOGIN='${{ github.event.inputs.user_login }}'
          SITE='https://irreverenthealth.com'
          echo "Requesting reset for $USER_LOGIN from runner IP $(curl -s https://ifconfig.me)"
          # Get login page / cookies
          curl -sL -c /tmp/cj -b /tmp/cj "$SITE/wp-login.php?action=lostpassword" -o /tmp/lp.html -w "GET %{http_code}\n"
          # Submit lostpassword
          CODE=$(curl -sL -c /tmp/cj -b /tmp/cj -o /tmp/lp2.html -w "%{http_code}" \
            -X POST "$SITE/wp-login.php?action=lostpassword" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "user_login=$USER_LOGIN" \
            --data-urlencode "wp-submit=Get New Password" \
            --data-urlencode "redirect_to=" \
            -e "$SITE/wp-login.php?action=lostpassword")
          echo "POST $CODE"
          python3 - <<'PY'
          import re
          html=open('/tmp/lp2.html',encoding='utf-8',errors='replace').read()
          print('len', len(html))
          print('checkemail', 'checkemail=confirm' in html or 'Check your email' in html)
          print('error', 'login_error' in html or 'ERROR' in html)
          print('wordfence', 'wordfence' in html.lower() or 'limited by the site owner' in html.lower())
          # print short snippet of message
          m=re.search(r'<div id="login_error".*?</div>|<p class="message".*?</p>|Check your email.*?</p>', html, re.S|re.I)
          if m: print('msg', re.sub('<[^>]+>',' ',m.group(0))[:300])
          else: print('body_head', re.sub('<[^>]+>',' ',html)[:400])
          PY

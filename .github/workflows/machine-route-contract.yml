name: Machine route contract (required)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WP→Machine route contract
        run: python ci/check_wp_machine_route_contract.py --plugin-root "$GITHUB_WORKSPACE"

      - name: Plugin version contract
        run: python ci/check_plugin_version_contract.py

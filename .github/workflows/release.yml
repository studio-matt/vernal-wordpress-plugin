name: Build & Release Plugin (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        id: set_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from production folder"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Update version in production files
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd ${{ secrets.SERVER_PATH }}
            sed -i "s/Version: [0-9.]*/Version: \$VERSION/" vernal-contentum.php
            sed -i "s/define('VERNAL_CONTENTUM_VERSION', '[^']*');/define('VERNAL_CONTENTUM_VERSION', '\$VERSION');/" vernal-contentum.php
          EOF
          echo "Version updated to $VERSION in production"

      - name: Download files from production server
        run: |
          mkdir -p dist/vernal-contentum
          rsync -avz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }} \
            dist/vernal-contentum/

      - name: Build ZIP from production files
        run: |
          PLUGIN_SLUG="vernal-contentum"
          cd dist
          zip -r ${PLUGIN_SLUG}.zip $PLUGIN_SLUG
          
          echo "ZIP created from production folder: ${PLUGIN_SLUG}.zip"
          ls -lh ${PLUGIN_SLUG}.zip

      - name: Checkout repo for tagging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.set_version.outputs.version }}" -m "Release version ${{ steps.set_version.outputs.version }}"
          git push origin "v${{ steps.set_version.outputs.version }}"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vernal-contentum.zip
          tag_name: v${{ steps.set_version.outputs.version }}
          name: Release v${{ steps.set_version.outputs.version }}
          body: |
            ## Version ${{ steps.set_version.outputs.version }}
            
            ${{ github.event.inputs.release_notes || 'Official release built from production.' }}
            
            ### Installation
            1. Download the ZIP file below
            2. Upload via WordPress Admin → Plugins → Add New → Upload Plugin
            3. Or extract to `/wp-content/plugins/vernal-contentum/`
            
            ### Update
            If you have the plugin installed, WordPress will automatically detect this update.
          draft: false
          prerelease: false


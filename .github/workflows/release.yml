name: Build & Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from production folder"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Download files from production server
        run: |
          mkdir -p dist/vernal-contentum
          rsync -avz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }} \
            dist/vernal-contentum/

      - name: Build ZIP from production files
        run: |
          PLUGIN_SLUG="vernal-contentum"
          cd dist
          zip -r ${PLUGIN_SLUG}.zip $PLUGIN_SLUG
          
          echo "ZIP created from production folder: ${PLUGIN_SLUG}.zip"
          ls -lh ${PLUGIN_SLUG}.zip

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vernal-contentum.zip
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Version ${{ steps.get_version.outputs.version }}
            
            Automated release from tag ${{ github.ref }}.
            
            ### Installation
            1. Download the ZIP file below
            2. Upload via WordPress Admin → Plugins → Add New → Upload Plugin
            3. Or extract to `/wp-content/plugins/vernal-contentum/`
            
            ### Update
            If you have the plugin installed, WordPress will automatically detect this update.
          draft: false
          prerelease: false


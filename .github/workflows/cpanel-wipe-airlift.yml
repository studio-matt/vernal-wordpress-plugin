name: cPanel wipe Airlift HTTPS cache

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: cPanel UAPI / API2 file probe and wipe
        env:
          CP_HOST: ${{ secrets.SERVER }}
          CP_USER: ${{ secrets.USERNAME }}
          CP_PASS: ${{ secrets.PASSWORD }}
        run: |
          python3 <<'PY'
          import os, json, ssl, urllib.parse, urllib.request, base64

          host = os.environ["CP_HOST"].strip()
          user = os.environ["CP_USER"].strip()
          password = os.environ["CP_PASS"]
          auth = base64.b64encode(f"{user}:{password}".encode()).decode()

          ctx = ssl.create_default_context()

          def call(port, path, params=None):
              q = ("?" + urllib.parse.urlencode(params or {})) if params else ""
              url = f"https://{host}:{port}{path}{q}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Basic {auth}",
                  "User-Agent": "vernal-cpanel-wipe/1.0",
              })
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=45) as r:
                      body = r.read().decode("utf-8", "replace")
                      return r.status, body
              except Exception as e:
                  code = getattr(e, "code", None)
                  body = ""
                  if hasattr(e, "read"):
                      try:
                          body = e.read().decode("utf-8", "replace")
                      except Exception:
                          body = str(e)
                  return code or 0, body or str(e)

          print("user", user, "host", host)

          # Probe common cPanel ports/endpoints
          probes = [
              (2083, f"/execute/Fileman/list_files", {"dir": "/home"}),
              (2083, f"/execute/Fileman/list_files", {"dir": f"/home/{user}"}),
              (2083, f"/execute/Fileman/list_files", {"dir": "public_html"}),
              (2083, f"/execute/Reseller/list_accounts", {}),
              (2083, f"/execute/Variables/get_user_information", {}),
              (2082, f"/execute/Fileman/list_files", {"dir": "public_html"}),
              (2083, f"/json-api/listaccts", {"api.version": "1"}),
          ]
          for port, path, params in probes:
              status, body = call(port, path, params)
              print(f"\nPORT {port} {path} params={params} -> {status}")
              print(body[:800].replace("\n", " "))

          # If reseller, try wiping sibling path via Fileman trash/remove
          targets = [
              "/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html",
              "/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html_gzip",
              "public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html",
          ]
          for t in targets:
              for port in (2083, 2082):
                  for path, params in [
                      ("/execute/Fileman/trash", {"files": json.dumps([t])}),
                      ("/execute/Fileman/remove_files", {"files": json.dumps([t]), "dir": "/"}),
                      ("/execute/Fileman/trash", {"path": t}),
                  ]:
                      status, body = call(port, path, params)
                      if status and status != 404:
                          print(f"wipe {port} {path} {t} -> {status} {body[:300]}")
          PY

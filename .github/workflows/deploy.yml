name: Deploy to Server (SSH)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::error::SERVER_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "::error::SERVER_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then
            echo "::error::SERVER_PATH secret is not set"
            exit 1
          fi
          echo "✓ All secrets are configured"
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo "Path: ${{ secrets.SERVER_PATH }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SERVER="${{ secrets.SERVER_HOST }}"
          echo "Attempting to connect to: $SERVER"
          echo "Testing DNS resolution..."
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname may not be publicly resolvable. Trying ssh-keyscan anyway..."
          fi
          # Try to resolve hostname first
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname '$SERVER' is not publicly resolvable"
            echo "This is OK if you're using an IP address, but if using hostname, GitHub Actions cannot reach it"
          fi
          
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::Failed to resolve or connect to $SERVER"
            echo ""
            echo "SOLUTION: Use your server's PUBLIC IP ADDRESS instead of hostname"
            echo ""
            echo "To find your server's IP:"
            echo "1. SSH into your server"
            echo "2. Run: curl -s ifconfig.me"
            echo "3. Update SERVER_HOST secret with the IP address (e.g., 123.45.67.89)"
            echo ""
            echo "Current SERVER_HOST value: $SERVER"
            exit 1
          }
          echo "✓ Server added to known hosts"
      
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo 'SSH connection successful'" || {
            echo "::error::SSH connection failed"
            echo "Please verify:"
            echo "1. SERVER_HOST is correct: ${{ secrets.SERVER_HOST }}"
            echo "2. SERVER_USER is correct: ${{ secrets.SERVER_USER }}"
            echo "3. SSH_PRIVATE_KEY matches the public key on the server"
            exit 1
          }

      - name: Verify server path exists
        run: |
          echo "Checking if server path exists..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "test -d '${{ secrets.SERVER_PATH }}' || mkdir -p '${{ secrets.SERVER_PATH }}'" || {
            echo "::error::Cannot create or access SERVER_PATH: ${{ secrets.SERVER_PATH }}"
            exit 1
          }
          echo "✓ Server path verified: ${{ secrets.SERVER_PATH }}"

      - name: Deploy files via rsync
        run: |
          echo "Deploying files to: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            --exclude='VERSIONING.md' \
            --exclude='TROUBLESHOOTING.md' \
            --exclude='UPDATE_SYSTEM.md' \
            --exclude='SECRETS_SETUP.md' \
            --exclude='.DS_Store' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }} || {
            echo "::error::rsync deployment failed"
            exit 1
          }
          echo "✓ Files deployed successfully"
      
      - name: Verify deployment
        run: |
          echo "Verifying deployed files..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "ls -la '${{ secrets.SERVER_PATH }}' | head -20" || {
            echo "::error::Cannot verify deployment"
            exit 1
          }
          echo "✓ Deployment verified"


name: Deploy to Server (SSH)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::error::SERVER_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "::error::SERVER_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then
            echo "::error::SERVER_PATH secret is not set"
            exit 1
          fi
          echo "✓ All secrets are configured"
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo "Path: ${{ secrets.SERVER_PATH }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SERVER="${{ secrets.SERVER_HOST }}"
          echo "Attempting to connect to: $SERVER"
          echo "Testing DNS resolution..."
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname may not be publicly resolvable. Trying ssh-keyscan anyway..."
          fi
          # Try to resolve hostname first
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname '$SERVER' is not publicly resolvable"
            echo "This is OK if you're using an IP address, but if using hostname, GitHub Actions cannot reach it"
          fi
          
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::Failed to resolve or connect to $SERVER"
            echo ""
            echo "SOLUTION: Use your server's PUBLIC IP ADDRESS instead of hostname"
            echo ""
            echo "To find your server's IP:"
            echo "1. SSH into your server"
            echo "2. Run: curl -s ifconfig.me"
            echo "3. Update SERVER_HOST secret with the IP address (e.g., 123.45.67.89)"
            echo ""
            echo "Current SERVER_HOST value: $SERVER"
            exit 1
          }
          echo "✓ Server added to known hosts"
      
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo 'SSH connection successful'" || {
            echo "::error::SSH connection failed"
            echo "Please verify:"
            echo "1. SERVER_HOST is correct: ${{ secrets.SERVER_HOST }}"
            echo "2. SERVER_USER is correct: ${{ secrets.SERVER_USER }}"
            echo "3. SSH_PRIVATE_KEY matches the public key on the server"
            exit 1
          }

      - name: Verify server path exists
        run: |
          echo "Checking if server path exists..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "test -d '${{ secrets.SERVER_PATH }}' || mkdir -p '${{ secrets.SERVER_PATH }}'" || {
            echo "::error::Cannot create or access SERVER_PATH: ${{ secrets.SERVER_PATH }}"
            exit 1
          }
          echo "✓ Server path verified: ${{ secrets.SERVER_PATH }}"

      - name: Deploy files via rsync
        run: |
          echo "Deploying files to: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            --exclude='VERSIONING.md' \
            --exclude='TROUBLESHOOTING.md' \
            --exclude='UPDATE_SYSTEM.md' \
            --exclude='SECRETS_SETUP.md' \
            --exclude='.DS_Store' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }} || {
            echo "::error::rsync deployment failed"
            exit 1
          }
          echo "✓ Files deployed successfully"
      
      - name: Verify deployment
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          echo "Verifying deployed files..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "PRIMARY='$SERVER_PATH'; bash -s" <<'EOS'
          set +e
          ls -la "$PRIMARY" | head -20
          echo "whoami=$(whoami) HOME=$HOME"
          ls -la "$HOME" | head -40
          ls -la "$HOME/public_html" 2>/dev/null | head -30
          ls -la "$HOME/domains" 2>/dev/null | head -30
          echo "--- /home accounts ---"
          ls -la /home 2>/dev/null | head -60
          echo "--- airlift caches (home) ---"
          find "$HOME" -type d -path '*/cache/airlift' 2>/dev/null | while read -r d; do
            echo "Clearing $d"
            rm -rf "$d"/* "$d"/.[!.]* 2>/dev/null
            echo "cleared:$d"
          done
          echo "--- airlift caches (server-wide readable) ---"
          find /home -type d -path '*/cache/airlift' 2>/dev/null | while read -r d; do
            echo "Found $d"
            if [ -w "$d" ]; then
              rm -rf "$d"/* "$d"/.[!.]* 2>/dev/null
              echo "cleared:$d"
            else
              echo "not-writable:$d"
            fi
          done
          # Direct known Irreverent cache object (same box, Host-routed)
          for f in \
            /home/*/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html \
            /home/*/irreverenthealth.com/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html \
            /home/*/domains/irreverenthealth.com/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html
          do
            for match in $f; do
              if [ -f "$match" ]; then
                echo "Removing $match"
                rm -f "$match" "$match"_gzip 2>/dev/null
                echo "removed:$match"
              fi
            done
          done
          echo "--- sibling plugins ---"
          find "$HOME" /home -type f -name vernal-contentum.php 2>/dev/null | sed 's#/vernal-contentum.php$##' | sort -u | head -20
          EOS
          echo "✓ Deployment verified"

      # Addon domains / sibling WP installs on the same cPanel account often keep a
      # separate copy of the plugin (e.g. irreverenthealth.com). Sync every match.
      # Best-effort: never fail the primary deploy if discovery/SSH flakes.
      - name: Deploy to sibling vernal-contentum installs
        continue-on-error: true
        run: |
          set -uo pipefail
          HOST="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PRIMARY="${{ secrets.SERVER_PATH }}"
          echo "Discovering sibling plugin installs..."
          ssh_retry() {
            local n=0
            until ssh -o ConnectTimeout=15 -o ServerAliveInterval=5 "$HOST" "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then
                return 1
              fi
              echo "ssh retry $n..."
              sleep $((n*3))
            done
          }
          ssh_retry 'echo "whoami=$(whoami) HOME=$HOME"; ls -la "$HOME" 2>/dev/null | head -40; ls -la "$HOME/public_html" 2>/dev/null | head -30; ls -la "$HOME/domains" 2>/dev/null | head -30; ls /home 2>/dev/null | head -40; echo "--- airlift caches ---"; find "$HOME" -type d -path "*/cache/airlift" 2>/dev/null | head -20' || {
            echo "::warning::SSH diagnose failed; skipping siblings"
            exit 0
          }
          # Always wipe Airlift page-cache trees we can see (listing freezes live HTML).
          ssh_retry 'set +e
            find "$HOME" -type d -path "*/cache/airlift" 2>/dev/null | while read -r d; do
              echo "Clearing $d"
              rm -rf "$d"/* "$d"/.[!.]* 2>/dev/null
              echo "cleared:$d"
            done
          ' || echo "::warning::Airlift cache clear skipped"
          mapfile -t PATHS < <(ssh_retry 'set +e
            WHO=$(whoami)
            find "$HOME" /home/"$WHO" /home -xdev -type f -name vernal-contentum.php 2>/dev/null \
              | sed "s#/vernal-contentum.php\$##" | sort -u
          ' || true)
          echo "Found ${#PATHS[@]} install(s):"
          printf '  %s\n' "${PATHS[@]:-}"
          if [ "${#PATHS[@]}" -eq 0 ]; then
            echo "::warning::No vernal-contentum installs found via find; primary deploy only."
            exit 0
          fi
          for DEST in "${PATHS[@]}"; do
            DEST_N="${DEST%/}"
            PRIM_N="${PRIMARY%/}"
            if [ "$DEST_N" = "$PRIM_N" ]; then
              echo "Skip primary: $DEST_N"
              continue
            fi
            echo "Deploying sibling: $DEST_N"
            rsync -avz --delete \
              --exclude='.git' \
              --exclude='.git/**' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='README.md' \
              --exclude='DEPLOYMENT.md' \
              --exclude='VERSIONING.md' \
              --exclude='TROUBLESHOOTING.md' \
              --exclude='UPDATE_SYSTEM.md' \
              --exclude='SECRETS_SETUP.md' \
              --exclude='.DS_Store' \
              ./ "$HOST:$DEST_N/" || {
                echo "::warning::rsync to sibling failed: $DEST_N"
                continue
              }
            VER=$(ssh "$HOST" "grep -E '^ \\* Version:' \"$DEST_N/vernal-contentum.php\" | head -1" || true)
            echo "Sibling deployed: $DEST_N ($VER)"
          done
          echo "Sibling deploys complete"

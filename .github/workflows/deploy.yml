name: Deploy to Server (SSH)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::error::SERVER_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "::error::SERVER_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then
            echo "::error::SERVER_PATH secret is not set"
            exit 1
          fi
          echo "✓ All secrets are configured"
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo "Path: ${{ secrets.SERVER_PATH }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SERVER="${{ secrets.SERVER_HOST }}"
          echo "Attempting to connect to: $SERVER"
          echo "Testing DNS resolution..."
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname may not be publicly resolvable. Trying ssh-keyscan anyway..."
          fi
          # Try to resolve hostname first
          if ! host "$SERVER" > /dev/null 2>&1 && ! nslookup "$SERVER" > /dev/null 2>&1; then
            echo "::warning::Hostname '$SERVER' is not publicly resolvable"
            echo "This is OK if you're using an IP address, but if using hostname, GitHub Actions cannot reach it"
          fi
          
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::Failed to resolve or connect to $SERVER"
            echo ""
            echo "SOLUTION: Use your server's PUBLIC IP ADDRESS instead of hostname"
            echo ""
            echo "To find your server's IP:"
            echo "1. SSH into your server"
            echo "2. Run: curl -s ifconfig.me"
            echo "3. Update SERVER_HOST secret with the IP address (e.g., 123.45.67.89)"
            echo ""
            echo "Current SERVER_HOST value: $SERVER"
            exit 1
          }
          echo "✓ Server added to known hosts"
      
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo 'SSH connection successful'" || {
            echo "::error::SSH connection failed"
            echo "Please verify:"
            echo "1. SERVER_HOST is correct: ${{ secrets.SERVER_HOST }}"
            echo "2. SERVER_USER is correct: ${{ secrets.SERVER_USER }}"
            echo "3. SSH_PRIVATE_KEY matches the public key on the server"
            exit 1
          }

      - name: Verify server path exists
        run: |
          echo "Checking if server path exists..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "test -d '${{ secrets.SERVER_PATH }}' || mkdir -p '${{ secrets.SERVER_PATH }}'" || {
            echo "::error::Cannot create or access SERVER_PATH: ${{ secrets.SERVER_PATH }}"
            exit 1
          }
          echo "✓ Server path verified: ${{ secrets.SERVER_PATH }}"

      - name: Deploy files via rsync
        run: |
          echo "Deploying files to: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            --exclude='VERSIONING.md' \
            --exclude='TROUBLESHOOTING.md' \
            --exclude='UPDATE_SYSTEM.md' \
            --exclude='SECRETS_SETUP.md' \
            --exclude='.DS_Store' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }} || {
            echo "::error::rsync deployment failed"
            exit 1
          }
          echo "✓ Files deployed successfully"
      
      - name: Verify deployment
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          echo "Verifying deployed files..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "PRIMARY='$SERVER_PATH'; bash -s" <<'EOS'
          set +e
          ls -la "$PRIMARY" | head -20
          echo "whoami=$(whoami) HOME=$HOME"
          ls -la "$HOME" | head -40
          ls -la "$HOME/public_html" 2>/dev/null | head -30
          ls -la "$HOME/domains" 2>/dev/null | head -30
          echo "--- /home accounts ---"
          ls -la /home 2>/dev/null | head -60
          echo "--- airlift caches (home) ---"
          find "$HOME" -type d -path '*/cache/airlift' 2>/dev/null | while read -r d; do
            echo "Clearing $d"
            rm -rf "$d"/* "$d"/.[!.]* 2>/dev/null
            echo "cleared:$d"
          done
          echo "--- airlift caches (server-wide readable) ---"
          find /home -type d -path '*/cache/airlift' 2>/dev/null | while read -r d; do
            echo "Found $d"
            if [ -w "$d" ]; then
              rm -rf "$d"/* "$d"/.[!.]* 2>/dev/null
              echo "cleared:$d"
            else
              echo "not-writable:$d"
            fi
          done
          # Irreverent Health is a sibling cPanel account on this host (execute-bit traversal).
          IH_ROOT="/home/irreverenthealth/public_html"
          echo "--- irreverenthealth probe ---"
          ls -la "$IH_ROOT" 2>&1 | head -20
          ls -la "$IH_ROOT/wp-content/plugins" 2>&1 | head -30
          ls -la "$IH_ROOT/wp-content/cache/airlift/irreverenthealth.com/episodes" 2>&1 | head -20
          for f in \
            "$IH_ROOT/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html" \
            "$IH_ROOT/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html_gzip" \
            "$IH_ROOT/wp-content/cache/airlift/irreverenthealth.com/index-https.html"
          do
            if [ -e "$f" ]; then
              echo "Removing $f"
              rm -f "$f" && echo "removed:$f" || echo "rm-failed:$f"
            else
              echo "missing:$f"
            fi
          done
          # Wipe whole Irreverent Airlift tree if writable
          if [ -d "$IH_ROOT/wp-content/cache/airlift" ]; then
            echo "Wiping $IH_ROOT/wp-content/cache/airlift"
            rm -rf "$IH_ROOT/wp-content/cache/airlift"/* && echo "wiped-airlift" || echo "wipe-failed"
          fi
          echo "--- sibling plugins ---"
          find "$HOME" /home/irreverenthealth -type f -name vernal-contentum.php 2>/dev/null | sed 's#/vernal-contentum.php$##' | sort -u | head -20
          EOS
          echo "✓ Deployment verified"

      # Irreverent Health + siblings. Do NOT silently no-op — IH stuck on old plugin
      # breaks PATCH /media and structured featured_image SEO.
      - name: Deploy all sibling vernal-contentum installs (incl. Irreverent Health)
        run: |
          set -euo pipefail
          HOST="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PRIMARY="${{ secrets.SERVER_PATH }}"
          EXPECTED_VER=$(grep -E '^\s*\*\s*Version:' vernal-contentum.php | head -1 | sed -E 's/.*Version:\s*([0-9.]+).*/\1/')
          echo "Expected plugin version: $EXPECTED_VER"

          ssh_retry() {
            local n=0
            until ssh -o ConnectTimeout=20 -o ServerAliveInterval=5 "$HOST" "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then
                return 1
              fi
              echo "ssh retry $n..."
              sleep $((n*3))
            done
          }

          CANDIDATES=(
            "/home/irreverenthealth/public_html/wp-content/plugins/vernal-contentum"
            "/home/irreverenthealth/domains/irreverenthealth.com/public_html/wp-content/plugins/vernal-contentum"
            "/home/irreverenthealth/www/wp-content/plugins/vernal-contentum"
            "/home/irreverenthealth/public_html/domains/irreverenthealth.com/wp-content/plugins/vernal-contentum"
          )

          mapfile -t FOUND < <(ssh_retry 'set +e
            find /home -xdev -type f -name vernal-contentum.php 2>/dev/null \
              | sed "s#/vernal-contentum.php\$##" | sort -u
          ' || true)

          echo "Found on disk:"
          printf '  %s\n' "${FOUND[@]:-}"

          DEST_SET=()
          for d in "${CANDIDATES[@]}" "${FOUND[@]}"; do
            [ -n "${d:-}" ] || continue
            DEST_SET+=("${d%/}")
          done
          mapfile -t DESTS < <(printf '%s\n' "${DEST_SET[@]}" | awk 'NF && !seen[$0]++')

          IH_OK=0
          ANY_SIBLING=0
          for DEST_N in "${DESTS[@]}"; do
            PRIM_N="${PRIMARY%/}"
            if [ "$DEST_N" = "$PRIM_N" ]; then
              echo "Skip primary (already deployed): $DEST_N"
              continue
            fi
            ANY_SIBLING=1
            echo "Deploying sibling: $DEST_N"
            if ! ssh_retry "mkdir -p '$DEST_N' && test -w '$DEST_N'"; then
              echo "::error::Cannot write $DEST_N"
              continue
            fi
            rsync -avz --delete \
              --exclude='.git' --exclude='.git/**' --exclude='.github' \
              --exclude='.gitignore' --exclude='README.md' --exclude='DEPLOYMENT.md' \
              --exclude='VERSIONING.md' --exclude='TROUBLESHOOTING.md' \
              --exclude='UPDATE_SYSTEM.md' --exclude='SECRETS_SETUP.md' --exclude='.DS_Store' \
              ./ "$HOST:$DEST_N/"
            VER_LINE=$(ssh_retry "grep -E '^ \\* Version:' '$DEST_N/vernal-contentum.php' | head -1" || true)
            echo "  on-disk: $VER_LINE"
            ssh_retry "touch '$DEST_N/vernal-contentum.php' '$DEST_N/includes/class-vernal-api.php' 2>/dev/null; true" || true
            if echo "$VER_LINE" | grep -q "$EXPECTED_VER"; then
              if echo "$DEST_N" | grep -qi irreverenthealth; then
                IH_OK=1
              fi
            else
              echo "::error::Version mismatch at $DEST_N (wanted $EXPECTED_VER)"
            fi
            ssh_retry "ROOT=\$(dirname \$(dirname \$(dirname '$DEST_N'))); rm -rf \"\$ROOT/cache/airlift\"/* 2>/dev/null; true" || true
          done

          if [ "$ANY_SIBLING" -eq 0 ]; then
            echo "::error::No sibling plugin installs found (Irreverent Health not updated)"
            exit 1
          fi
          if [ "$IH_OK" -ne 1 ]; then
            echo "::error::Irreverent Health plugin path was not updated to $EXPECTED_VER"
            echo "Live site will keep serving the old plugin until this path is writable from the deploy user."
            exit 1
          fi
          echo "✓ Sibling deploys verified at $EXPECTED_VER"

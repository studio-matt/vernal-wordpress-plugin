name: IH cache hunt via cPanel SSH

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Try sibling accounts + copy HTTP cache over HTTPS via PHP CLI if possible
        run: |
          HOST='${{ secrets.SERVER_HOST }}'
          USER='${{ secrets.SERVER_USER }}'
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" bash -s <<'EOS'
          set +e
          KEY=$(cat ~/.ssh/authorized_keys 2>/dev/null | head -1 | awk '{print $2}')
          echo "our_key_fp=$(echo "$KEY" | head -c 20)..."
          for acct in irreverenthealth thenewheadshop envoy matthamp; do
            echo "=== try ssh $acct@localhost ==="
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$acct@localhost" 'whoami; ls public_html/wp-content/cache/airlift 2>&1 | head' 2>&1 | head -10
          done
          echo "=== php as suexec? ==="
          # If ea-php can run a file we write under /tmp that deletes - open_basedir may block
          TMP=$(mktemp /tmp/wipeXXXX.php)
          cat > "$TMP" <<'PHP'
          <?php
          $f='/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html';
          echo "exists=". (file_exists($f)?'1':'0') ." writable=". (is_writable($f)?'1':'0') ."\n";
          echo "dir_writable=". (is_writable(dirname($f))?'1':'0') ."\n";
          @unlink($f); @unlink($f.'_gzip');
          echo "after_exists=". (file_exists($f)?'1':'0') ."\n";
          PHP
          for bin in php ea-php81 ea-php82 ea-php80 /usr/local/bin/php; do
            if command -v $bin >/dev/null 2>&1; then
              echo "run $bin"
              $bin "$TMP" 2>&1 | head -20
            fi
          done
          rm -f "$TMP"
          echo "=== verify ==="
          curl -sL -A 'Mozilla/5.0' 'https://irreverenthealth.com/episodes/' | python3 -c "import sys;b=sys.stdin.read();i=b.lower().find('doug beitz');j=b.lower().find('sarah hill');print('lock_picks', 'lock picks' in b[i:j].lower())"
          EOS

name: IH cache hunt via cPanel SSH

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: cPanel session Fileman wipe with FTP secrets
        env:
          CP_HOST: ${{ secrets.SERVER }}
          CP_USER: ${{ secrets.USERNAME }}
          CP_PASS: ${{ secrets.PASSWORD }}
        run: |
          python3 <<'PY'
          import json, ssl, urllib.parse, urllib.request, http.cookiejar, re

          host = (os := __import__('os')).environ['CP_HOST'].strip()
          user = os.environ['CP_USER'].strip()
          password = os.environ['CP_PASS']
          # SERVER might be hostname or IP; try IP:2083 and host:2083
          bases = []
          for h in {host, '50.6.198.220', 'irreverenthealth.com'}:
            bases.append(f'https://{h}:2083')

          ctx = ssl._create_unverified_context()

          def try_login(base, u, p):
            cj = http.cookiejar.CookieJar()
            opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ctx),
              urllib.request.HTTPCookieProcessor(cj),
            )
            data = urllib.parse.urlencode({'user': u, 'pass': p}).encode()
            req = urllib.request.Request(base + '/login/?login_only=1', data=data, method='POST')
            try:
              with opener.open(req, timeout=30) as r:
                body = r.read().decode('utf-8', 'replace')
                return opener, r.status, body, cj
            except Exception as e:
              body = ''
              if hasattr(e, 'read'):
                try: body = e.read().decode('utf-8','replace')
                except Exception: body = str(e)
              return opener, getattr(e, 'code', 0), body, cj

          # Try ftp user and irreverenthealth with same password
          users = [user, 'irreverenthealth', 'irreverent']
          opener = None
          base_ok = None
          login_user = None
          for base in bases:
            for u in users:
              opener, status, body, cj = try_login(base, u, password)
              print(f'login {base} user={u} status={status} body={body[:120]!r}')
              if status == 200 and ('security_token' in body or '"status":1' in body.replace(' ','') or 'redirect' in body.lower()):
                base_ok, login_user = base, u
                break
              # cPanel often returns JSON {"status":1,"redirect":"...","security_token":"..."}
              try:
                j = json.loads(body)
                if j.get('status') == 1:
                  base_ok, login_user = base, u
                  print('parsed ok', j)
                  break
              except Exception:
                pass
            if base_ok:
              break

          if not base_ok:
            raise SystemExit('cPanel login failed for all user/host combos')

          print('SUCCESS login', login_user, base_ok)

          # Extract security token from cookies or body
          token = None
          try:
            j = json.loads(body)
            token = j.get('security_token') or j.get('redirect','').split('?')[0]
          except Exception:
            pass
          for c in cj:
            print('cookie', c.name, c.value[:20])
            if 'token' in c.name.lower():
              token = c.value

          # Call UAPI execute endpoints with session cookies
          paths = [
            '/execute/Fileman/list_files',
            f'{token}/execute/Fileman/list_files' if token and token.startswith('/') else None,
          ]
          dirs = [
            '/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes',
            'wp-content/cache/airlift/irreverenthealth.com/episodes',
            'public_html/wp-content/cache/airlift/irreverenthealth.com/episodes',
          ]
          for d in dirs:
            for path in [p for p in paths if p]:
              q = urllib.parse.urlencode({'dir': d})
              url = base_ok + path + '?' + q
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                with opener.open(req, timeout=30) as r:
                  print('list', path, d, r.status, r.read()[:500])
              except Exception as e:
                print('list fail', path, d, e)

          # Trash
          targets = [
            '/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html',
            '/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html_gzip',
          ]
          for t in targets:
            for func in ('trash', 'remove_files'):
              path = f'/execute/Fileman/{func}'
              q = urllib.parse.urlencode({'files': json.dumps([t])})
              req = urllib.request.Request(base_ok + path + '?' + q, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                with opener.open(req, timeout=30) as r:
                  print(func, t, r.status, r.read()[:400])
              except Exception as e:
                print(func, 'fail', t, e)
          PY

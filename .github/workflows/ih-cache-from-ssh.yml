name: IH cache hunt via cPanel SSH

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: sudo whmapi1 / virtfs / ACL wipe
        run: |
          set -e
          HOST='${{ secrets.SERVER_HOST }}'
          USER='${{ secrets.SERVER_USER }}'
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" bash -s <<'EOS'
          set +e
          echo "id=$(id)"
          echo "=== sudo -n whmapi1 ==="
          sudo -n whmapi1 uapi_cpanel cpanel=irreverenthealth module=Fileman func=list_files dir=/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes 2>&1 | head -c 2500
          echo
          echo "=== sudo -n rm ==="
          sudo -n rm -f /home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html \
            /home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/index-https.html_gzip 2>&1
          echo rm_exit=$?
          echo "=== sudo -n ls ==="
          sudo -n ls -la /home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes/ 2>&1 | head -20
          echo "=== virtfs ==="
          ls -la /home/virtfs 2>&1 | head
          ls -la /home/virtfs/irreverenthealth 2>&1 | head
          ls -la /home/virtfs/irreverenthealth/home/irreverenthealth/public_html/wp-content/cache/airlift/irreverenthealth.com/episodes 2>&1 | head
          echo "=== sudo -l ==="
          sudo -l 2>&1 | head -40
          echo "=== verify ==="
          curl -sL -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' 'https://irreverenthealth.com/episodes/' \
            | python3 -c "import sys; b=sys.stdin.read(); i=b.lower().find('doug beitz'); j=b.lower().find('sarah hill'); c=b[i:j]; print('lock_picks', 'lock picks' in c.lower())"
          EOS

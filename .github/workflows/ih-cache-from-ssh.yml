name: IH cache hunt via cPanel SSH

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Accesshash / token / setfacl probes
        run: |
          HOST='${{ secrets.SERVER_HOST }}'
          USER='${{ secrets.SERVER_USER }}'
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" bash -s <<'EOS'
          set +e
          echo "=== accesshash / tokens (names only) ==="
          ls -la ~/.accesshash /root/.accesshash 2>&1 | head
          find "$HOME/.cpanel" -iname '*token*' -o -iname '*hash*' -o -iname '*whm*' 2>/dev/null | head -30
          # Prefer not printing secrets; only report whether files exist and length
          if [ -f "$HOME/.accesshash" ]; then echo accesshash_len=$(wc -c < "$HOME/.accesshash"); fi
          echo "=== setfacl on IH home? ==="
          getfacl /home/irreverenthealth /home/irreverenthealth/public_html 2>&1 | head -40
          echo "=== try install SSH key into IH authorized_keys via world-writable? ==="
          ls -la /home/irreverenthealth/.ssh 2>&1 | head
          echo "=== cPanel API tokens via uapi ==="
          uapi --output=json Tokens list 2>&1 | head -c 800
          echo
          uapi --output=json SSH listkeys 2>&1 | head -c 500
          echo
          echo "=== can we chmod o+x on parent if we own a symlink? ==="
          ls -la /home/irreverenthealth/public_html 2>&1 | head
          # last resort: php as CGI via own account fetching and... can't write remote
          echo done
          EOS
